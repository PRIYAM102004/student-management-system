<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="./index1.css">
</head>

<body>
<h1>Student Management System</h1>

<form id="StudentForm">

    <div class="form-group">
        <label>Name</label>
        <input type="text" id="name" placeholder="Enter name" required>
    </div>

    <div class="form-group">
        <label>Age</label>
        <input type="number" id="age" placeholder="Enter age" required>
    </div>

    <div class="form-group">
        <label>Gender</label>
        <input type="text" id="gender" placeholder="Enter gender" required>
    </div>

    <div class="form-group">
        <label>Department</label>
        <input type="text" id="department" placeholder="Enter department" required>
    </div>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email" required>
    </div>

    <div class="form-group">
        <label>Phone</label>
        <input type="number" id="phone" placeholder="Enter phone" required>
    </div>

    <div class="form-group">
        <label>City</label>
        <input type="text" id="city" placeholder="Enter city" required>
    </div>

    <div class="form-group">
        <label>Mark</label>
        <input type="number" id="mark" placeholder="Enter mark" required>
    </div>

    <div class="form-group">
        <label>Fees</label>
        <input type="number" id="fees" placeholder="Enter fees" required>
    </div>

    <button type="submit">Register Student</button>

</form>
    
    <script src="./index.js"></script>
</body>
</html>
